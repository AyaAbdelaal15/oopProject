<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Game Reviews</title>

    <link rel="shortcut icon" href="./images/logo-sm.png" type="image/x-icon" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css"
    />

    <link rel="stylesheet" href="./css/bootstrap.min.css" />

    <link rel="stylesheet" href="./css/style.css" />
  </head>

  <body>
    <!-- ================= HEADER ================= -->

    <header class="header">
      <div class="container">
        <nav class="nav">
          <!-- Logo -->
          <div class="logo">
            <div class="imgLogo">
              <img src="./images/logo-sm.png" alt="Game Reviews Logo" />
            </div>

            <div class="titleLogo">
              <h4>Game Reviews</h4>
            </div>
          </div>

          <!-- Mobile Menu Button -->
          <button class="iconMenu" type="button" aria-label="Open menu">
            <i class="fa-solid fa-bars"></i>
          </button>

          <!-- Categories -->
          <div class="lists">
            <div class="ulLinks">
              <ul>
                <li>
                  <a href="#" class="active" data-target="mmorpg"> MMORPG </a>
                </li>

                <li>
                  <a href="#" data-target="shooter"> SHOOTER </a>
                </li>

                <li>
                  <a href="#" data-target="sailing"> SAILING </a>
                </li>

                <li>
                  <a href="#" data-target="permadeath"> PERMADEATH </a>
                </li>

                <li>
                  <a href="#" data-target="superhero"> SUPERHERO </a>
                </li>

                <li>
                  <a href="#" data-target="pixel"> PIXEL </a>
                </li>
              </ul>
            </div>
          </div>
        </nav>
      </div>
    </header>

    <!-- ================= GAMES SECTION ================= -->

    <main class="gamesSection">
      <div class="container">
        <div class="row cardsBox"></div>
      </div>
    </main>

    <!-- ================= DETAILS SECTION ================= -->

    <section class="detailsCard"></section>

    <!-- ================= LOADING ================= -->

    <div class="loading d-none">
      <span class="loader"></span>
    </div>

    <script src="./js/bootstrap.bundle.min.js"></script>

    <script type="module" src="./js/script.js"></script>
  </body>
</html>
